name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get Dependencies
        run: |
          cd frontend
          flutter pub get
          
      - name: Calculate Base Href & Target Dir
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base_href=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
            echo "dest_dir=" >> $GITHUB_OUTPUT
          else
            # Clean branch name for URL safety (replace slash with hyphen)
            CLEAN_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "base_href=/${{ github.event.repository.name }}/previews/${CLEAN_NAME}/" >> $GITHUB_OUTPUT
            echo "dest_dir=previews/${CLEAN_NAME}" >> $GITHUB_OUTPUT
          fi
          
      - name: Build Web
        run: |
          cd frontend
          flutter build web --release --base-href "${{ steps.config.outputs.base_href }}"
          
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          destination_dir: ${{ steps.config.outputs.dest_dir }}
          keep_files: true

